<script src="qa.js"></script>

<script>
const hidden = document.getElementById('hiddenInput');
const typed  = document.getElementById('typed');
const log    = document.getElementById('log');
const adminBox = document.getElementById('adminBox');
const adminOut = document.getElementById('adminOut');
const copyBtn  = document.getElementById('copyBtn');
const closeAdminBtn = document.getElementById('closeAdminBtn');

function respDelayMs(){ return 1200 + Math.random() * 600; } // à garder
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function addLine(who,text){
  const d=document.createElement('div');
  d.className='chatLine';
  d.innerHTML=`<span class="who">${escapeHtml(who)}</span>${escapeHtml(text)}`;
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
  return d;
}

function addThinkingLine(){
  return addLine("néa ▮","…");
}

// 15 recadrages
const WAIT_SNARK = [
  "Ai au moins la politesse d’attendre que je termine.",
  "Deux secondes. Laisse-moi finir.",
  "Tu peux taper, oui. Envoyer, non. Pas encore.",
  "Patience. Je suis en train d’écrire.",
  "On fait ça proprement: tu attends la fin de ma réponse.",

  "Tu vois le curseur ? Il travaille. Toi, tu attends.",
  "Tu veux vraiment m’interrompre au milieu d’une phrase ?",
  "Respire. Je termine. Ensuite c’est à toi.",
  "Tu vas trop vite. Laisse-moi finir mon idée.",
  "Je réponds. Après, je t’écoute.",
  "Encore une seconde et je te rends la parole.",
  "Pas d’empilement. Un à la fois.",
  "Prépare ta question… mais attends que je conclue.",

];

// 15 reprises
const RESUME_PHRASES = [
  "Où j’en étais déjà ? Ah oui. Donc, je disais: ",
  "Où j’en étais… voilà. Donc je disais: ",
  "Je reprends. Donc je disais: ",
  "Recentrons. Donc je disais: ",

  "Je termine mon idée. Donc je disais: ",
  "Je reprends ma phrase. Donc je disais: ",
  "Allez. Donc je disais: "

// 15 fins "tu peux parler maintenant"
const YOU_CAN_SPEAK = [
  "Voilà. J’ai terminé. Tu peux parler maintenant.",
  "C’est bon pour moi. À toi.",
  "Terminé. Je t’écoute.",
  "Voilà, fin de réponse. Tu peux y aller.",
  "J’ai fini. À ton tour.",
  "Ok. J’ai posé le point final. Parle.",
  "Je te rends la parole.",
  "C’est tout. Tu peux envoyer ta question.",
  "Voilà. Maintenant, c’est ton moment.",
  "J’ai fini d’écrire. À toi de jouer.",
  "Fin. Tu peux reprendre.",
  "C’est bon. Je suis prête. Parle.",
  "Voilà. Je me tais. À toi.",
  "Réponse terminée. Tu peux parler.",

];

// -----------------------------
// Matching (simple)
// -----------------------------
function normalize(s){
  return (s||"").toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g," ").trim();
}

function bestMatch(q){
  const base = (window.QA_BASE && Array.isArray(window.QA_BASE)) ? window.QA_BASE : [];
  const u = normalize(q);
  let best=null,score=0;

  for(const it of base){
    if (!it) continue;
    const all=[it.q, ...(it.aliases||[])].filter(Boolean);
    for(const c of all){
      const cn=normalize(c);
      const s = (cn===u) ? 1 : ((u.includes(cn)||cn.includes(u)) ? 0.85 : 0);
      if(s>score){score=s;best=it;}
    }
  }
  return score>=0.78 ? best : null;
}

function buildQaSnippet(questionRaw){
  const q = (questionRaw || "").trim();
  const now = new Date().toISOString();
  return JSON.stringify({
    q,
    aliases: [],
    a: "TODO: réponse canonique (voix de Néa).",
    tags: [],
    updatedAt: now
  }, null, 2);
}

function showAdmin(snippet){
  adminOut.value = snippet || "";
  adminBox.style.display = "block";
  adminOut.scrollTop = 0;
}
function hideAdmin(){
  adminBox.style.display = "none";
  adminOut.value = "";
}

// -----------------------------
// Typing engine (stable + interrupt)
// -----------------------------
let isTyping = false;
let activeTyping = null; // state
let isBanned = false;


function clearTimer(state){
  if (state && state.timer){
    clearTimeout(state.timer);
    state.timer = null;
  }
}

function renderTypingLine(state, shownText){
  if (!state || !state.div) return;
  state.div.innerHTML =
    `<span class="who">${escapeHtml(state.who)}</span><span class="msg">${escapeHtml(shownText)}</span>`;
  log.scrollTop = log.scrollHeight;
}

function startTypingLine(div, who, fullText, onDone){
  if (activeTyping){
    activeTyping.cancelled = true;
    clearTimer(activeTyping);
  }

  const state = {
    who,
    text: String(fullText ?? ""),
    idx: 0,
    div,
    timer: null,
    doneCb: (typeof onDone === "function") ? onDone : null,
    interruptRequested: false,
    interruptStartIdx: 0,
    cancelled: false,
    _interrupting: false
  };

  activeTyping = state;
  isTyping = true;

  div.innerHTML = `<span class="who">${escapeHtml(who)}</span><span class="msg"></span>`;
  scheduleStep(state);
}

function scheduleStep(state){
  if (!state || state.cancelled) return;

  if (state.idx >= state.text.length){
    isTyping = false;
    activeTyping = null;
    if (typeof state.doneCb === "function") state.doneCb();
    return;
  }

  const ch = state.text[state.idx];
  const shown = state.text.slice(0, state.idx + 1);
  renderTypingLine(state, shown);
  state.idx++;

  if (state.interruptRequested && !state._interrupting){
    const isGoodStop = ".!?…\n".includes(ch);
    const tooFar = state.idx >= Math.min(state.text.length, state.interruptStartIdx + 140);

    if (isGoodStop || tooFar){
      clearTimer(state);
      injectInterruptionFlow(state);
      return;
    }
  }

  let extra = 0;
  if (".!?…".includes(ch)) extra = 180 + Math.random()*180;
  if (",;:".includes(ch))  extra = 90 + Math.random()*120;
  if (ch === "\n")         extra = 120 + Math.random()*120;

  const base = 12 + Math.random() * 55;

  clearTimer(state);
  state.timer = setTimeout(() => scheduleStep(state), base + extra);
}

async function injectInterruptionFlow(state){
  if (!state || state._interrupting || state.cancelled) return;
  state._interrupting = true;

  clearTimer(state);

  const full = state.text;
  let cutIdx = state.idx;

  const lookAhead = full.slice(cutIdx, cutIdx + 160);
  const m = lookAhead.match(/[.!?…]\s|\n/);
  if (m && m.index != null){
    cutIdx = cutIdx + m.index + 1;
  }

  const before = full.slice(0, cutIdx).trimEnd();
  let remaining = full.slice(cutIdx).replace(/^\s+/, "");

  // Pas de "..." ajoutés
  state.text = before;
  state.idx = before.length;
  renderTypingLine(state, before);

  state.cancelled = true;
  activeTyping = null;

  await sleep(1500);

  const reprimandDiv = addLine("néa ▮", "");
  startTypingLine(reprimandDiv, "néa ▮", pick(WAIT_SNARK), async () => {
    await sleep(1500);

    const resumeDiv = addLine("néa ▮", "");
    startTypingLine(resumeDiv, "néa ▮", pick(RESUME_PHRASES), () => {
      const contDiv = addLine("néa ▮", "");
      startTypingLine(contDiv, "néa ▮", remaining, () => {
        const endDiv = addLine("néa ▮", "");
        startTypingLine(endDiv, "néa ▮", pick(YOU_CAN_SPEAK), () => {});
      });
    });
  });
}

function requestInterruption(){
  if (!activeTyping || activeTyping.cancelled) return;
  if (!activeTyping.interruptRequested){
    activeTyping.interruptRequested = true;
    activeTyping.interruptStartIdx = activeTyping.idx;
  }
}

// -----------------------------
// Modération insultes
// -----------------------------
let insultCount = 0;

const BANNED_WORDS = [
  "connard", "con", "conne", "salope", "pute",
  "encule", "enculé", "enculer",
  "fdp", "fils de pute",
  "batard", "bâtard",
  "merde", "merdique",
  "chiant", "chiante",
  "debile", "débile",
  "abruti", "abrutie",
  "idiot", "idiote",
  "imbecile", "imbécile",
  "tg", "ta gueule",
  "nique", "nique ta mere",
  "ntm",
  "salaud", "salopard",
  "crevard"
];

const POLITE_WARNINGS = [
  "On va s’arrêter là. Garde un minimum de tenue.",
  "Ce n’est pas le ton attendu ici.",
  "Tu peux t’exprimer sans être vulgaire.",
  "Je ne réponds pas aux attaques gratuites.",
  "Respire. Reformule. On continuera.",
  "Je suis ouverte aux questions, pas aux insultes.",
  "Ce genre de langage ne t’aidera pas.",
  "Reste correct. Sinon la discussion s’arrête.",
  "Je te laisse une chance de reformuler.",
  "Ce n’est pas comme ça qu’on me parle.",
  "Tu peux faire mieux que ça.",
  "Je ne suis pas ici pour encaisser.",
  "Encore une sortie comme ça, et je coupe.",
  "On se calme. Maintenant.",
  "Dernier avertissement."
];

const POLITE_KICK = [
  "Très bien. La discussion s’arrête ici.",
  "Tu viens de perdre l’accès à cet échange.",
  "Je t’avais prévenue. Fin de conversation.",
  "Ce dialogue est terminé.",
  "Je ne continuerai pas avec ce ton.",
  "C’est terminé pour aujourd’hui.",
  "Reviens quand tu sauras parler.",
  "La porte est là.",
  "Conversation close.",
  "Je coupe ici.",
  "On s’arrête là.",
  "Fin de session.",
  "Ce n’est plus un échange, donc j’arrête.",
  "Je ne répondrai plus.",
  "Sortie forcée."
];

function containsInsult(text){
  const n = normalize(text);
  if (!n) return false;
  const padded = " " + n + " ";
  return BANNED_WORDS.some(w => padded.includes(" " + normalize(w) + " "));
}

const FILLER_YESNO_INPUTS = ["oui","ouais","yes","si","non","nan","no","nop"];

const FILLER_YESNO_RESPONSES = [
  "Ok. Mais dis-moi plutôt ce que tu veux savoir.",
  "D’accord. Pose ta question clairement.",
  "Très bien. Tu veux parler du chapitre 1, ou d’autre chose ?",
  "Je t’écoute. Une vraie question, maintenant.",
  "On va éviter les réponses fantômes. Qu’est-ce que tu cherches ?"
];

function isFillerYesNo(msg){
  const m = normalize(msg);
  return FILLER_YESNO_INPUTS.includes(m);
}

// -----------------------------
// Réactions ACK (ok/cool...) + Oui/Non
// -----------------------------
const ACK_INPUTS = [
  "ok","okay","okey","ah ok","ah okay","ah d accord","daccord","d acc","dac",
  "cool","trop bien","excellent","genial","génial","super","parfait","nickel","top",
  "ca marche","ça marche","ca roule","ça roule","j ai compris","j'ai compris",
  "j ai capte","j'ai capté","capté","capice","capiche","je vois","ah je vois",
  "c est clair","c'est clair","clair","bon","bon ok","bon d accord","bon d'accord",
  "entendu","bien compris"
];

const ACK_RESPONSES = [
  "Content d’avoir pu t’aider.",
  "Parfait. Si quelque chose te revient, je suis là.",
  "Cool si c’est plus clair.",
  "Très bien. Tu sais où me trouver.",
  "À ton service.",
  "Bien. On peut continuer quand tu veux.",
  "Ravie que tu aies suivi.",
  "Ok. N’hésite pas si une question surgit.",
  "Parfait alors.",
  "Cool. On avance.",
  "Content que ça fasse sens.",
  "Bien. On peut aller plus loin si tu veux.",
  "Ok. Je reste là.",
  "Parfait. On continue ?",
  "Cool. Prochaine question quand tu veux.",
  "Bien. On est synchro."
];

function isAckMessage(text){
  const n = normalize(text);
  if (!n) return false;
  if (ACK_INPUTS.some(x => n === normalize(x))) return true;
  if (n.length <= 18 && ACK_INPUTS.some(x => n.includes(normalize(x)))) return true;
  return false;
}

function setAwaitingFromAnswer(answer){
  const a = normalize(answer);
  // déclencheurs simples (tu pourras affiner)
  awaitingYesNo =
    a.includes("oui ou non") ||
    a.includes("reponds par oui") ||
    a.includes("reponds par non") ||
    a.includes("tu veux") ||
    a.includes("tu prefere") ||
    a.includes("tu preferes") ||
    a.endsWith(" ?"); // option: agressif, mais marche souvent
}


function isYesMsg(msg){
  const m = normalize(msg);

  // oui "pur"
  const PURE_YES = ["oui","ouais","yes","yep","yeah","si"];
  if (PURE_YES.includes(m)) return true;

  // oui "équivalent" seulement quand Néa attend un oui/non
  if (awaitingYesNo){
    const SOFT_YES = ["ok","okay","dac","daccord","d accord","ca marche","ça marche","vas y","vas-y","parfait","nickel"];
    if (SOFT_YES.includes(m)) return true;
  }

  return false;
}

function isNoMsg(msg){
  const m = normalize(msg);

  const PURE_NO = ["non","no","nop","nan","na"];
  if (PURE_NO.includes(m)) return true;

  if (awaitingYesNo){
    const SOFT_NO = ["pas vraiment","bof","negative","négatif"];
    if (SOFT_NO.includes(m)) return true;
  }

  return false;
}

// Néa attend quoi ?
let awaitingYesNo = false;
let awaitingQuestion = false;

// -----------------------------
// Behaviour / chat
// -----------------------------
function focusChat(){
  try{ hidden.focus(); } catch {}
}
document.addEventListener("click", ()=>focusChat());
window.addEventListener("load", ()=>setTimeout(focusChat, 120));
hidden.addEventListener("input", ()=>typed.textContent=hidden.value);

async function handleMessage(msg){

  // si Néa parle, on ne traite pas (la touche Enter gère l'interruption)
  if (isTyping) return;
  if (isBanned) return;

  // 1) Insultes
  if (containsInsult(msg)){
    insultCount++;

    if (insultCount === 1){
      const w = addLine("néa ▮", "");
      startTypingLine(w, "néa ▮", pick(POLITE_WARNINGS), () => {});
      return;
    }

    const k = addLine("néa ▮", "");
    startTypingLine(k, "néa ▮", pick(POLITE_KICK), () => {
      isBanned = true;
    });
    return;
  }

  // 2) Oui/Non contextuel
  const yes = isYesMsg(msg);
  const no  = isNoMsg(msg);

  if (yes || no){
    if (awaitingYesNo){
      awaitingYesNo = false;
      awaitingQuestion = true;

      const r = addLine("néa ▮", "");
      startTypingLine(
        r,
        "néa ▮",
        yes
          ? "Bien. Dis-moi ce que tu veux: une explication, un résumé, ou un détail précis ?"
          : "Très bien. Alors pose une autre question. Ou reformule clairement.",
        () => {}
      );
      return;
    }

    if (awaitingQuestion){
      const r = addLine("néa ▮", "");
      startTypingLine(r, "néa ▮", "Oui à quoi ? Pose la question, pas l’écho.", () => {});
      return;
    }

    const r = addLine("néa ▮", "");
    startTypingLine(r, "néa ▮", "Oui… mais à quoi exactement ? Donne-moi une phrase complète.", () => {});
    return;
  }

  // 3) ACK (ok/cool/parfait...) après oui/non
  if (isAckMessage(msg)){
    const d = addLine("néa ▮", "");
    startTypingLine(d, "néa ▮", pick(ACK_RESPONSES), () => {});
    return;
  }

  // "oui/non" sans contexte -> filler (évite le bug social)
if (!awaitingYesNo && isFillerYesNo(msg)){
  const d = addLine("néa ▮", "");
  startTypingLine(d, "néa ▮", pick(FILLER_YESNO_RESPONSES), () => {});
  return;
}

// --- Filtre YES/NO (uniquement si Néa attend un oui/non)
if (awaitingYesNo){
  if (isYesMsg(msg)){
    awaitingYesNo = false; // on consomme la réponse
    const d = addLine("néa ▮", "");
    startTypingLine(d, "néa ▮", "Ok.", () => {});
    return;
  }

  if (isNoMsg(msg)){
    awaitingYesNo = false;
    const d = addLine("néa ▮", "");
    startTypingLine(d, "néa ▮", "Très bien.", () => {});
    return;
  }
}

  
  // 4) Réponse normale (FAQ)
  try{
    isTyping = true;

    const thinkingEl = addThinkingLine();
    await sleep(respDelayMs());

    // reset par défaut
    awaitingYesNo = false;
    awaitingQuestion = false;

    const hit = bestMatch(msg);
    const answer = hit ? ((hit.a || "").trim() || "…") : "Je ne sais pas.";

    setAwaitingFromAnswer(answer);

    startTypingLine(thinkingEl, "néa ▮", answer, () => {

      // Heuristiques: est-ce que Néa attend une question ?
      const a = normalize(answer);
      awaitingQuestion =
        a.includes("tu as des questions") ||
        a.includes("pose ta question") ||
        a.includes("qu est ce que tu veux me demander") ||
        a.includes("qu'est ce que tu veux me demander");

      // Heuristique: est-ce que Néa a posé un vrai oui/non ?
      awaitingYesNo =
        (answer.includes("?") || answer.trim().endsWith(" ?")) &&
        (
          a.includes("tu veux") ||
          a.includes("tu preferes") || a.includes("tu préfères") ||
          a.includes("tu confirmes") || a.includes("tu confirmes") ||
          a.includes("tu es d accord") || a.includes("tu es d'accord") ||
          a.includes("tu souhaites")
        );

      if (!hit){
        const l2 = addLine("néa ▮", "");
        startTypingLine(l2, "néa ▮", "Échap. Crée la fiche. Et je saurai la prochaine fois.", () => {
          adminOut.value = buildQaSnippet(msg);
          awaitingQuestion = true;
        });
      }
    });

  } catch (err){
    addLine("néa ▮", "Erreur JS. Ouvre la console (F12) et copie l’erreur ici.");
    console.error(err);
    isTyping = false;
    activeTyping = null;
  }
}

hidden.addEventListener("keydown", (e)=>{
  if (e.key === "Enter"){
    e.preventDefault();

    // si Néa parle: interruption (sans enregistrer)
    if (isTyping){
      requestInterruption();
      return;
    }

    if (isBanned) return;

    const msg = hidden.value.trim();
    if(!msg) return;

    addLine("lecteur ▮", msg);
    hidden.value=""; typed.textContent="";
    handleMessage(msg);
    return;
  }

  if (e.key === "Escape"){
    e.preventDefault();
    if (adminBox.style.display === "block") hideAdmin();
    else showAdmin(adminOut.value || buildQaSnippet(""));
  }
});

copyBtn.addEventListener("click", async () => {
  try{
    await navigator.clipboard.writeText(adminOut.value || "");
    addLine("néa ▮", "Copié.");
  } catch {
    addLine("néa ▮", "Impossible de copier automatiquement. Sélectionne puis copie manuellement.");
  }
});

closeAdminBtn.addEventListener("click", () => hideAdmin());
</script>
</body>
</html>
