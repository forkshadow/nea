<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Consortium</title>

  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --muted: rgba(255,255,255,.55);
      --soft: rgba(255,255,255,.10);
      --soft2: rgba(255,255,255,.16);
      --fs: 22px;
      --barW: 14px;
      --barH: 26px;
      --gap: 10px;
    }

    html, body{
      margin:0; padding:0; width:100%; height:100%;
      background:var(--bg); color:var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      overflow:hidden;
    }

    #hiddenInput{
      position:absolute; left:-9999px; opacity:0;
    }

    #stage{
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
      box-sizing:border-box;
    }

    #panel{
      width:min(960px, 94vw);
    }

    #intro{
      border:1px solid var(--soft);
      border-radius:14px;
      padding:18px 16px;
      background: rgba(255,255,255,.02);
      margin-bottom:18px;
    }

    .line{
      margin:10px 0;
      line-height:1.55;
      opacity:.96;
      white-space: pre-wrap;
    }

    .neaTag{ opacity:.75; }

    #chat{
      border:1px solid var(--soft);
      border-radius:14px;
      padding:16px 14px;
      background: rgba(255,255,255,.02);
    }

    #log{
      min-height: 200px;
      max-height: 46vh;
      overflow:auto;
      padding: 0 2px 14px 2px;
      box-sizing:border-box;
      line-height: 1.4;
      font-size: 16px;
      opacity: .92;
    }

    .chatLine{ margin: 10px 0; white-space: pre-wrap; }
    .who{ opacity:.60; margin-right:8px; }

    #row{
      display:flex;
      align-items:center;
      gap: var(--gap);
      border-top:1px solid rgba(255,255,255,.10);
      padding-top:10px;
      margin-top:10px;
    }

    #typed{
      font-size: var(--fs);
      white-space: pre-wrap;
      word-break: break-word;
      min-height: var(--barH);
      flex: 1 1 auto;
    }

    #cursor{
      width: var(--barW);
      height: var(--barH);
      background: var(--fg);
      display:inline-block;
      transform: translateY(2px);
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink{ 50%{ opacity:0; } }

    #hint{
      margin-top: 12px;
      font-size: 12px;
      opacity: .38;
      user-select:none;
    }

    #adminBox{
      display:none;
      margin-top:14px;
      border-top:1px solid rgba(255,255,255,.10);
      padding-top:14px;
    }

    #adminLabel{
      font-size:12px;
      opacity:.55;
      margin-bottom:8px;
    }

    #adminOut{
      width:100%;
      background:#000;
      color:#fff;
      border:1px solid rgba(255,255,255,.2);
      padding:12px;
      font-family: inherit;
      font-size:13px;
      box-sizing:border-box;
      min-height:120px;
      resize:vertical;
      white-space: pre-wrap;
    }

    .btnRow{
      margin-top:10px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button{
      background: rgba(255,255,255,.06);
      color:#fff;
      border:1px solid rgba(255,255,255,.18);
      padding:8px 10px;
      border-radius:10px;
      font-family: inherit;
      font-size:12px;
      cursor:pointer;
      opacity:.92;
    }
    button:hover{ opacity:1; background: rgba(255,255,255,.10); }
  </style>
</head>

<body>
<input id="hiddenInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"/>

<div id="stage">
  <div id="panel">

    <div id="intro">
      <div class="line"><span class="neaTag">néa ▮</span> Tu es arrivé jusqu’ici.</div>
      <div class="line"><span class="neaTag">néa ▮</span> Bravo.</div>
      <div class="line"><span class="neaTag">néa ▮</span> Si quelque chose t’échappe, pose ta question.</div>
    </div>

    <div id="chat">
      <div id="log"></div>

      <div id="row">
        <div id="typed"></div>
        <span id="cursor"></span>
      </div>

      <div id="hint">Entrée pour envoyer • Clique pour activer • Échap : mode Auteur</div>

      <div id="adminBox">
        <div id="adminLabel">Mode Auteur — à copier dans <code>qa.js</code></div>
        <textarea id="adminOut" readonly></textarea>
        <div class="btnRow">
          <button id="copyBtn" type="button">Copier</button>
          <button id="closeAdminBtn" type="button">Fermer</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="qa.js"></script>

<script>
  const hidden = document.getElementById('hiddenInput');
  const typed  = document.getElementById('typed');
  const log    = document.getElementById('log');
  const adminBox = document.getElementById('adminBox');
  const adminOut = document.getElementById('adminOut');
  const copyBtn  = document.getElementById('copyBtn');
  const closeAdminBtn = document.getElementById('closeAdminBtn');

  // Délai avant la première frappe (1.2s -> 1.8s) appliqué à CHAQUE réponse
  function respDelayMs(){
    return 1200 + Math.random() * 600;
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g,m=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }

  function addLine(who,text){
    const d=document.createElement('div');
    d.className='chatLine';
    d.innerHTML=`<span class="who">${escapeHtml(who)}</span>${escapeHtml(text)}`;
    log.appendChild(d);
    log.scrollTop=log.scrollHeight;
    return d;
  }

  function addThinkingLine(){
    return addLine("néa ▮","…");
  }

  function randInt(min, max){
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  // 15 recadrages
  const WAIT_SNARK = [
    "Ai au moins la politesse d’attendre que je termine.",
    "Deux secondes. Laisse-moi finir.",
    "Tu peux taper, oui. Envoyer, non. Pas encore.",
    "Patience. Je suis en train d’écrire.",
    "On fait ça proprement: tu attends la fin de ma réponse.",
    "Je n’ai pas encore posé le point final.",
    "Tu vois le curseur ? Il travaille. Toi, tu attends.",
    "Tu veux vraiment m’interrompre au milieu d’une phrase ?",
    "Respire. Je termine. Ensuite c’est à toi.",
    "Tu vas trop vite. Laisse-moi finir mon idée.",
    "Je réponds. Après, je t’écoute.",
    "Encore une seconde et je te rends la parole.",
    "Pas d’empilement. Un à la fois.",
    "Prépare ta question… mais attends que je conclue.",
    "Si tu insistes, je clignote plus fort."
  ];

  // 15 reprises (“Donc, je disais…”)
  const RESUME_PHRASES = [
    "Donc, je disais, ",
    "Bref. Je reprends: ",
    "Revenons à mon point: ",
    "Je reprends où j’en étais: ",
    "Pour en revenir à ta question: ",
    "Je continue: ",
    "Comme je te l’expliquais: ",
    "Où en étais-je… voilà: ",
    "Très bien. Reprenons: ",
    "Sans interruption, maintenant: ",
    "Je poursuis, donc: ",
    "Pour finir ce que je disais: ",
    "Recentrons: ",
    "Et donc, pour conclure ce passage: ",
    "Allez. Suite: "
  ];

  // -----------------------------
  // Matching (simple)
  // -----------------------------
  function normalize(s){
    return (s||"").toLowerCase().normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9]+/g," ").trim();
  }

  function bestMatch(q){
    const base = (window.QA_BASE && Array.isArray(window.QA_BASE)) ? window.QA_BASE : [];
    const u = normalize(q);
    let best=null,score=0;

    for(const it of base){
      if (!it) continue;
      const all=[it.q, ...(it.aliases||[])].filter(Boolean);
      for(const c of all){
        const cn=normalize(c);
        const s = (cn===u) ? 1 : ((u.includes(cn)||cn.includes(u)) ? 0.85 : 0);
        if(s>score){score=s;best=it;}
      }
    }
    return score>=0.78 ? best : null;
  }

  function buildQaSnippet(questionRaw){
    const q = (questionRaw || "").trim();
    const now = new Date().toISOString();
    return JSON.stringify({
      q,
      aliases: [],
      a: "TODO: réponse canonique (voix de Néa).",
      tags: [],
      updatedAt: now
    }, null, 2);
  }

  function showAdmin(snippet){
    adminOut.value = snippet || "";
    adminBox.style.display = "block";
    adminOut.scrollTop = 0;
  }
  function hideAdmin(){
    adminBox.style.display = "none";
    adminOut.value = "";
  }

  // -----------------------------
  // Typing engine (pause/resume + insertion tapée lettre par lettre)
  // -----------------------------
  let isTyping = false;

  // activeTyping = { who, text, idx, div, timer, doneCb, isInjectedLock }
  let activeTyping = null;

  function renderTypingLine(state, shownText){
    state.div.innerHTML =
      `<span class="who">${escapeHtml(state.who)}</span><span class="msg">${escapeHtml(shownText)}</span>`;
    log.scrollTop = log.scrollHeight;
  }

  function pauseTyping(){
    if (!activeTyping) return;
    if (activeTyping.timer) clearTimeout(activeTyping.timer);
    activeTyping.timer = null;
  }

  function resumeTyping(){
    if (!activeTyping) return;
    const state = activeTyping;

    function step(){
      const ch = state.text[state.idx];

      // vitesse variable + pauses de ponctuation
      const base = 12;
      const jitter = Math.random() * 55;

      let extra = 0;
      if (".!?…".includes(ch)) extra = 180 + Math.random()*180;
      if (",;:".includes(ch))  extra = 90 + Math.random()*120;
      if (ch === "\n")         extra = 120 + Math.random()*120;

      const shown = state.text.slice(0, state.idx + 1);
      renderTypingLine(state, shown);

      state.idx++;

      if (state.idx >= state.text.length){
        isTyping = false;
        const cb = state.doneCb;
        activeTyping = null;
        if (typeof cb === "function") cb();
        return;
      }

      state.timer = setTimeout(step, base + jitter + extra);
    }

    state.timer = setTimeout(step, 40);
  }

  function startTypingLine(div, who, fullText, onDone){
    const state = {
      who,
      text: String(fullText ?? ""),
      idx: 0,
      div,
      timer: null,
      doneCb: typeof onDone === "function" ? onDone : null,
      isInjectedLock: false
    };
    activeTyping = state;
    isTyping = true;

    div.innerHTML = `<span class="who">${escapeHtml(who)}</span><span class="msg"></span>`;
    resumeTyping();
  }

  // Interruption: pause -> ajoute "…" (instantané) -> pause 1.5s -> insère réprimande+reprise DANS le texte
  async function injectInterruption(){
    if (!activeTyping) return;

    const state = activeTyping;

    // Empêche le spam d'interruptions en rafale pendant la même injection
    if (state.isInjectedLock) return;
    state.isInjectedLock = true;

    pauseTyping();

    const before = state.text.slice(0, state.idx);
    const remaining = state.text.slice(state.idx);

    // 1) On pose juste "…" tout de suite, et on gèle
    const snapped = before + "…";
    state.text = snapped;          // temporaire: on freeze visuellement sur "…"
    state.idx = snapped.length;
    renderTypingLine(state, snapped);

    // 2) Latence avant réprimande (comme tu voulais)
    await sleep(1500);

    // 3) On reconstruit le flux COMPLET à taper ensuite (lettre par lettre via le moteur)
    const reprimand = " " + pick(WAIT_SNARK);
    const resume = " " + pick(RESUME_PHRASES);

    // On garde le "…" (déjà affiché), et on ajoute tout le reste derrière
    const full = snapped + reprimand + resume + remaining;

    state.text = full;

    // idx reste sur snapped.length, donc le moteur va taper reprimand+resume+remaining lettre par lettre
    state.idx = snapped.length;

    // mini-pause respiration (optionnelle, très légère)
    await sleep(40);

    // On relance
    state.isInjectedLock = false;
    resumeTyping();
  }

  // -----------------------------
  // Behaviour / chat
  // -----------------------------
  function focusChat(){
    try{ hidden.focus(); } catch {}
  }
  document.addEventListener("click", ()=>focusChat());
  window.addEventListener("load", ()=>setTimeout(focusChat, 120));
  hidden.addEventListener("input", ()=>typed.textContent=hidden.value);

  async function handleMessage(msg){
    if (isTyping) return;

    try{
      isTyping = true;

      const thinkingEl = addThinkingLine();
      await sleep(respDelayMs());

      const hit = bestMatch(msg);
      const answer = hit ? ((hit.a || "").trim() || "…") : "Je ne sais pas.";

      startTypingLine(thinkingEl, "néa ▮", answer, () => {
        if (!hit){
          const l2 = addLine("néa ▮", "");
          startTypingLine(l2, "néa ▮", "Échap. Crée la fiche. Et je saurai la prochaine fois.", () => {
            adminOut.value = buildQaSnippet(msg);
          });
        }
      });

    } catch (err){
      addLine("néa ▮", "Erreur JS. Ouvre la console (F12) et copie l’erreur ici.");
      console.error(err);
      isTyping = false;
      activeTyping = null;
    } finally{
      if (!activeTyping) isTyping = false;
    }
  }

  hidden.addEventListener("keydown", (e)=>{
    if (e.key === "Enter"){
      e.preventDefault();

      // Si Néa tape: interruption intégrée à la même bulle
      if (isTyping && activeTyping){
        injectInterruption();
        return;
      }

      const msg = hidden.value.trim();
      if(!msg) return;

      addLine("lecteur ▮", msg);
      hidden.value=""; typed.textContent="";
      handleMessage(msg);
      return;
    }

    if (e.key === "Escape"){
      e.preventDefault();
      if (adminBox.style.display === "block") hideAdmin();
      else showAdmin(adminOut.value || buildQaSnippet(""));
    }
  });

  copyBtn.addEventListener("click", async () => {
    try{
      await navigator.clipboard.writeText(adminOut.value || "");
      addLine("néa ▮", "Copié.");
    } catch {
      addLine("néa ▮", "Impossible de copier automatiquement. Sélectionne puis copie manuellement.");
    }
  });

  closeAdminBtn.addEventListener("click", () => hideAdmin());

  addLine("néa ▮","Pose ta question.");
</script>
</body>
</html>
