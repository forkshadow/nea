<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Consortium</title>

  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --muted: rgba(255,255,255,.55);
      --soft: rgba(255,255,255,.10);
      --soft2: rgba(255,255,255,.16);
      --fs: 22px;
      --barW: 14px;
      --barH: 26px;
      --gap: 10px;
    }

    html, body{
      margin:0; padding:0; width:100%; height:100%;
      background:var(--bg); color:var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      overflow:hidden;
    }

    #hiddenInput{
      position:absolute; left:-9999px; opacity:0;
    }

    #stage{
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
      box-sizing:border-box;
    }

    #panel{
      width:min(960px, 94vw);
    }

    #intro{
      border:1px solid var(--soft);
      border-radius:14px;
      padding:18px 16px;
      background: rgba(255,255,255,.02);
      margin-bottom:18px;
    }

    .line{
      margin:10px 0;
      line-height:1.55;
      opacity:.96;
      white-space: pre-wrap;
    }

    .neaTag{ opacity:.75; }

    #chat{
      border:1px solid var(--soft);
      border-radius:14px;
      padding:16px 14px;
      background: rgba(255,255,255,.02);
    }

    #log{
      min-height: 200px;
      max-height: 46vh;
      overflow:auto;
      padding: 0 2px 14px 2px;
      box-sizing:border-box;
      line-height: 1.4;
      font-size: 16px;
      opacity: .92;
    }

    .chatLine{ margin: 10px 0; white-space: pre-wrap; }
    .who{ opacity:.60; margin-right:8px; }

    #row{
      display:flex;
      align-items:center;
      gap: var(--gap);
      border-top:1px solid rgba(255,255,255,.10);
      padding-top:10px;
      margin-top:10px;
    }

    #typed{
      font-size: var(--fs);
      white-space: pre-wrap;
      word-break: break-word;
      min-height: var(--barH);
      flex: 1 1 auto;
    }

    #cursor{
      width: var(--barW);
      height: var(--barH);
      background: var(--fg);
      display:inline-block;
      transform: translateY(2px);
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink{ 50%{ opacity:0; } }

    #hint{
      margin-top: 12px;
      font-size: 12px;
      opacity: .38;
      user-select:none;
    }

    #adminBox{
      display:none;
      margin-top:14px;
      border-top:1px solid rgba(255,255,255,.10);
      padding-top:14px;
    }

    #adminLabel{
      font-size:12px;
      opacity:.55;
      margin-bottom:8px;
    }

    #adminOut{
      width:100%;
      background:#000;
      color:#fff;
      border:1px solid rgba(255,255,255,.2);
      padding:12px;
      font-family: inherit;
      font-size:13px;
      box-sizing:border-box;
      min-height:120px;
      resize:vertical;
      white-space: pre-wrap;
    }

    .btnRow{
      margin-top:10px;
      display:flex;
      gap:10px;
    }

    button{
      background: rgba(255,255,255,.06);
      color:#fff;
      border:1px solid rgba(255,255,255,.18);
      padding:8px 10px;
      border-radius:10px;
      font-family: inherit;
      font-size:12px;
      cursor:pointer;
    }
  </style>
</head>

<body>
<input id="hiddenInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"/>

<div id="stage">
  <div id="panel">

    <div id="intro">
      <div class="line"><span class="neaTag">néa ▮</span> Tu es arrivé jusqu’ici.</div>
      <div class="line"><span class="neaTag">néa ▮</span> Bravo.</div>
      <div class="line"><span class="neaTag">néa ▮</span> Si quelque chose t’échappe, pose ta question.</div>
    </div>

    <div id="chat">
      <div id="log"></div>

      <div id="row">
        <div id="typed"></div>
        <span id="cursor"></span>
      </div>

      <div id="hint">Entrée pour envoyer • Clique pour activer • Échap : mode Auteur</div>

      <div id="adminBox">
        <div id="adminLabel">Mode Auteur — à copier dans <code>qa.js</code></div>
        <textarea id="adminOut" readonly></textarea>
        <div class="btnRow">
          <button id="copyBtn" type="button">Copier</button>
          <button id="closeAdminBtn" type="button">Fermer</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Base Q/R -->
<script src="qa.js"></script>

<script>
  const hidden = document.getElementById('hiddenInput');
  const typed  = document.getElementById('typed');
  const log    = document.getElementById('log');
  const adminBox = document.getElementById('adminBox');
  const adminOut = document.getElementById('adminOut');
  const copyBtn  = document.getElementById('copyBtn');
  const closeAdminBtn = document.getElementById('closeAdminBtn');

  // IMPORTANT: on garde ton délai initial tel quel (même formule)
  const RESP_DELAY_MS = 1200 + Math.random() * 600;

  // ---------------- Helpers
  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g,m=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }

  function addLine(who,text){
    const d=document.createElement('div');
    d.className='chatLine';
    d.innerHTML=`<span class="who">${escapeHtml(who)}</span>${escapeHtml(text)}`;
    log.appendChild(d);
    log.scrollTop=log.scrollHeight;
    return d;
  }

  // petite ligne "…" pendant la réflexion
  function addThinkingLine(){
    return addLine("néa ▮","…");
  }

  function rand(min, max){
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  // frappe progressive dans UNE ligne déjà créée
  async function typeIntoLine(div, who, text){
    // recompose la ligne avec un span message vide
    div.innerHTML = `<span class="who">${escapeHtml(who)}</span><span class="msg"></span>`;
    const msgEl = div.querySelector(".msg");
    const raw = (text ?? "").toString();

    // vitesse variable
    const cps = rand(24, 40);                  // chars/sec
    const baseStep = Math.max(10, Math.floor(1000 / cps));
    const punctPauseMs = 220;

    for (let i = 0; i < raw.length; i++){
      msgEl.textContent += raw[i];
      log.scrollTop = log.scrollHeight;

      const ch = raw[i];
      let extra = 0;
      if (".!?…".includes(ch)) extra = punctPauseMs + rand(0, 180);
      if (",;:".includes(ch))  extra = Math.floor(punctPauseMs * 0.55) + rand(0, 120);
      if (ch === "\n")         extra = Math.floor(punctPauseMs * 0.6) + rand(0, 120);

      await sleep(baseStep + rand(0, 22) + extra);
    }
  }

  function normalize(s){
    return (s||"").toLowerCase().normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9]+/g," ").trim();
  }

  // version simple: renvoie directement l'item QA (ou null)
  function bestMatch(q){
    const u=normalize(q);
    let best=null,score=0;
    for(const it of (window.QA_BASE||[])){
      const all=[it.q,...(it.aliases||[])].filter(Boolean);
      for(const c of all){
        const cn=normalize(c);
        const s = (cn===u) ? 1 : ((u.includes(cn)||cn.includes(u)) ? 0.85 : 0);
        if(s>score){score=s;best=it;}
      }
    }
    return score>=0.78?best:null;
  }

  function buildQaSnippet(questionRaw){
    const q = (questionRaw || "").trim();
    const now = new Date().toISOString();
    return JSON.stringify({
      q,
      aliases: [],
      a: "TODO: réponse canonique (voix de Néa).",
      tags: [],
      updatedAt: now
    }, null, 2);
  }

  function showAdmin(snippet){
    adminOut.value = snippet || "";
    adminBox.style.display = "block";
    adminOut.scrollTop = 0;
  }
  function hideAdmin(){
    adminBox.style.display = "none";
    adminOut.value = "";
  }

  // ---------------- Behavior (latence + typewriter)
  let isTyping = false;

  function focusChat(){
    try{ hidden.focus(); } catch {}
  }
  document.addEventListener("click", ()=>focusChat());
  window.addEventListener("load", ()=>setTimeout(focusChat, 120));

  hidden.addEventListener("input", ()=>typed.textContent=hidden.value);

  async function handleMessage(msg){
    // Empêche les réponses qui se chevauchent si l’utilisateur spam Enter
    if (isTyping) return;
    isTyping = true;

    // affiche "…" tout de suite
    const thinkingEl = addThinkingLine();

    // IMPORTANT: on garde TON délai actuel exactement (RESP_DELAY_MS)
    await sleep(RESP_DELAY_MS);

    // on remplace "…" par la réponse tapée
    const hit = bestMatch(msg);

    if (hit){
      const answer = (hit.a || "").trim() || "…";
      await typeIntoLine(thinkingEl, "néa ▮", answer);
      isTyping = false;
      return;
    }

    // pas trouvé: on tape les messages fallback (dans 2 lignes séparées)
    // on réutilise la ligne "…" pour la première phrase
    await typeIntoLine(thinkingEl, "néa ▮", "Je ne sais pas.");

    const l2 = addLine("néa ▮", ""); // ligne vide, puis frappe dedans
    await typeIntoLine(l2, "néa ▮", "Échap. Crée la fiche. Et je saurai la prochaine fois.");

    adminOut.value = buildQaSnippet(msg);
    isTyping = false;
  }

  hidden.addEventListener("keydown", e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      const msg=hidden.value.trim();
      if(!msg) return;

      addLine("lecteur ▮", msg);
      hidden.value=""; typed.textContent="";

      handleMessage(msg);
    }

    if(e.key==="Escape"){
      e.preventDefault();
      if (adminBox.style.display === "block") hideAdmin();
      else showAdmin(adminOut.value || buildQaSnippet(""));
    }
  });

  copyBtn.addEventListener("click", async () => {
    try{
      await navigator.clipboard.writeText(adminOut.value || "");
      addLine("néa ▮", "Copié.");
    } catch {
      addLine("néa ▮", "Impossible de copier automatiquement. Sélectionne puis copie manuellement.");
    }
  });

  closeAdminBtn.addEventListener("click", () => hideAdmin());

  addLine("néa ▮","Pose ta question.");
</script>
</body>
</html>
``
